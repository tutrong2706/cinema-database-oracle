services:
  # Oracle Database 21c XE
  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: cinema-oracle-db
    environment:
      ORACLE_PASSWORD: dev123
      ORACLE_ALLOW_REMOTE: true
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "sqlplus", "-L", "dev/dev123@localhost:1521/XEPDB1", "as", "sysdba"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  oracle_data:
    driver: local
